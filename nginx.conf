server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The app routes on the client: /dashboard, /schedule, /cart and friends are
    # not files on disk. Without this fallback, opening one directly - or just
    # refreshing it - would 404 instead of loading the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints these filenames, so a stale copy can never be served
    # for new content and they are safe to cache for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html carries the references to those fingerprinted files, so it must
    # never be cached or the browser keeps loading the previous deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
